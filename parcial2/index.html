  <head>

    <title>Salteneria El Horno</title>

  <body>
    <header>
      <h1>Salteneria El Horno</h1>
      <p>
        Preparamos saltenas para nuestros clientes y recibimos pedidos de forma
        sencilla desde nuestra pagina.
      </p>
    </header>

    <form id="form-horno" novalidate method="POST" action="procesar.php">
      <label for="nombre">Nombre completo:</label><br />
      <input type="text" id="nombre" name="nombre" required /><br /><br />

      <label for="correo">Correo electronico:</label><br />
      <input type="email" id="correo" name="correo" required /><br /><br />

      <label for="pedido">Que saltenas queres:</label><br />
      <textarea id="pedido" name="pedido"></textarea><br /><br />

      <button type="submit">Hacer mi pedido</button>

      <p id="aviso-horno" class="aviso"></p>
    </form>
